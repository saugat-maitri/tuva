version: 2

models:
## Final
  - name: outliers__outlier_claims_agg
    description: Contains claims data of members who are flagged as outliers.
    config:
      schema: |
        {%- if var('tuva_schema_prefix',None) != None -%}{{var('tuva_schema_prefix')}}_outliers
        {% else %}outliers{%- endif -%}
      alias: claims_agg
      tags: outliers
      materialized: table
    columns:
      - name: claim_type
        description: >
          Indicates whether the claim is professional (CMS-1500), 
          institutional (UB-04), dental, or vision.
      - name: member_id
        description: >
          Identifier that links a patient to a particular insurance product or 
          health plan. A patient can have more than one member_id because they 
          can have more than one insurance product/plan.
      - name: incr_month
        description: Month when the claim was incurred.
      - name: incr_year
        description: Incurred year (year the claim or payment was incurred).
      - name: dx_code
        description: Diagnosis code associated with the claim.
      - name: dx_description
        description: Description of the diagnosis code.
      - name: dx_ccsr_category1
        description: CCSR body system category for the diagnosis.
      - name: dx_ccsr_category2
        description: CCSR category description for the diagnosis.
      - name: encounter_id
        description: Unique identifier for the encounter.
      - name: encounter_type
        description: Type of encounter.
      - name: encounter_group
        description: Group classification for the encounter.
      - name: service_category_1
        description: The first service category of the claim line
      - name: service_category_2
        description: The second, more specific service category of the claim line
      - name: service_category_3
        description: The third, even more specific service category of the claim line.
      - name: ms_drg_code
        description: The Medicare Severity Diagnosis Related Group (MS-DRG) code.
      - name: ms_drg_description
        description: Description for the MS-DRG code.
      - name: apr_drg_code
        description: The All Patient Refined Diagnosis Related Group (APR-DRG) code.
      - name: apr_drg_description
        description: Description for the APR-DRG code.
      - name: revenue_center_code
        description: Revenue center code for the claim.
      - name: revenue_center_description
        description: Description of the revenue center code.
      - name: hcpcs_code
        description: HCPCS level 1 or level 2 code for the claim line.
      - name: rbcs_cat_desc
        description: RBCS category description.
      - name: rbcs_subcat_desc
        description: RBCS subcategory description.
      - name: rbcs_family_desc
        description: RBCS family description.
      - name: paid_amount
        description: Total paid amount for the claim group.
      - name: total_paid
        description: Total paid amount for all members in the year.
      - name: outlier_threshold
        description: Threshold for outlier detection (mean + 2*stddev).
      - name: total_members
        description: Total number of members in the year.
  - name: outliers__outlier_member_months
    description: Contains member months data of members who are flagged as outliers.
    config:
      schema: |
        {%- if var('tuva_schema_prefix',None) != None -%}{{var('tuva_schema_prefix')}}_outliers
        {% else %}outliers{%- endif -%}
      alias: member_months
      tags: outliers
      materialized: table
    columns:
      - name: person_id
        description: Unique identifier for each patient.
        tests:
            - not_null
      - name: member_id
        description: >
          Identifier that links a patient to a particular insurance product or 
          health plan. A patient can have more than one member_id because they 
          can have more than one insurance product/plan.
      - name: year
        description: Year extracted from year_month of member_month.
      - name: year_month
        description: The year and month of the member month.
      - name: sex
        description: Sex of the patient.
      - name: race
        description: Race of the patient.
      - name: state
        description: State of residence.
      - name: age
        description: Age of the patient.
      - name: age_group
        description: Age group of the patient.
      - name: payment_year
        description: Payment year for risk score.
      - name: v24_risk_score
        description: Version 24 risk score for the patient.
      - name: population_normalized_risk_score
        description: Risk score normalized by the population annual average for the payment year.

