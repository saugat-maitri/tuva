      - name: incr_date
        description: Incurred date of the claim.
      - name: paid_date
        description: Date the claim was paid.
      - name: incr_month
        description: Month when the claim was incurred.
      - name: paid_month
        description: Month when the claim was paid.
      - name: incr_year
        description: Incurred year (year the claim or payment was incurred).
      - name: paid_year
        description: Year the claim was paid.
      - name: ndc_code
        description: National Drug Code for the dispensed drug.
      - name: ndc_description
        description: Description of the NDC code.
      - name: quantity
        description: Quantity dispensed.
      - name: days_supply
        description: Number of days supplied.
      - name: refills
        description: Number of refills.
      - name: paid_amount
        description: Total paid amount for the claim line.
      - name: prescriber_npi
        description: NPI of the prescribing provider.
      - name: dispensing_npi
        description: NPI of the dispensing provider.
      - name: rx_norm_code
        description: RxNorm concept unique identifier (RXCUI).
      - name: rxnorm_description
        description: Description for the RxNorm code.
      - name: atc_1_code
        description: ATC level 1 code.
      - name: atc_1_name
        description: ATC level 1 name.
      - name: atc_2_code
        description: ATC level 2 code.
