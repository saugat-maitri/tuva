  - name: outliers__int_outlier_members
    config:
      schema: |
        {%- if var('tuva_schema_prefix',None) != None -%}{{var('tuva_schema_prefix')}}_outliers
        {% else %}outliers{%- endif -%}
      alias: _int_outlier_members
      tags: outliers
    description: Intermediate model to identify outlier members by paid amount per year.
    columns:
      - name: member_id
        description: >
          Identifier that links a patient to a particular insurance product or 
          health plan. A patient can have more than one member_id because they 
          can have more than one insurance product/plan.
      - name: incr_year
        description: Incurred year (year the claim or payment was incurred).
      - name: paid
        description: Total paid amount for the member in the year.
      - name: total_members
        description: Total number of members in the year.
      - name: mean_paid
        description: Average paid amount for members in the year.
      - name: outlier_threshold
        description: Threshold for outlier detection (mean + 2*stddev).
      - name: percent_paid
        description: Proportion of total paid amount for the member.
      - name: total_paid
        description: Total paid amount for all members in the year.
      - name: outlier_flag
        description: "'OUTLIER' if paid > threshold, else 'NORMAL'."
  - name: outliers__int_rx_claims
    config:
      schema: |
        {%- if var('tuva_schema_prefix',None) != None -%}{{var('tuva_schema_prefix')}}_outliers
        {% else %}outliers{%- endif -%}
      alias: _int_rx_claims
      tags: outliers
      materialized: view
    description: Enriches pharmacy claims with RxNorm and ATC classification details for each claim line.
    columns:
